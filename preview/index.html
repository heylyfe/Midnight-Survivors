<!doctype html><html><head><meta charset="utf-8"><title>Sprite preview</title>
<style>
body{background:#171a24;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:24px;display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.card{background:#20232f;border-radius:12px;padding:14px 22px;text-align:center}
h2{margin:4px 0 10px}
img.spr{image-rendering:pixelated;width:120px;background:#2a2e3d;border-radius:6px;display:block;margin:auto}
input{width:120px}
</style></head><body>
<h1 style="width:100%">Proposed pixel sprites - pick or tweak</h1>

<div class="card">
  <h2>ichigo</h2>
  <img id="img0" src="sprites/ichigo.png" class="spr draggable">
  <div>zoom <input type="range" min="1" max="16" value="6" oninput="document.getElementById('img0').style.width=(this.value)+'px'"></div>
</div>

<div class="card">
  <h2>rukia</h2>
  <img id="img1" src="sprites/rukia.png" class="spr draggable">
  <div>zoom <input type="range" min="1" max="16" value="6" oninput="document.getElementById('img1').style.width=(this.value)+'px'"></div>
</div>

<div class="card">
  <h2>frieren</h2>
  <img id="img2" src="sprites/frieren.png" class="spr draggable">
  <div>zoom <input type="range" min="1" max="16" value="6" oninput="document.getElementById('img2').style.width=(this.value)+'px'"></div>
</div>

<div class="card">
  <h2>kaido</h2>
  <img id="img3" src="sprites/kaido.png" class="spr draggable">
  <div>zoom <input type="range" min="1" max="16" value="6" oninput="document.getElementById('img3').style.width=(this.value)+'px'"></div>
</div>

<div class="card">
  <h2>gojo</h2>
  <img id="img4" src="sprites/gojo.png" class="spr draggable">
  <div>zoom <input type="range" min="1" max="16" value="6" oninput="document.getElementById('img4').style.width=(this.value)+'px'"></div>
</div>
<div class="card" style="width:100%">
<h2>Sheet</h2><img src="sprites/sheet.png" style="image-rendering:pixelated;width:100%;max-width:1200px">
</div></body></html>
